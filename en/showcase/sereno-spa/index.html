ing else I build: how to reach me, restoring purchases, and where your data lives.\"}},\"footer\":{\"backToTop\":\"Back to Top\",\"scrollToTop\":\"Scroll to top\",\"copyright\":\"Pedro Feiteira. All rights reserved.\",\"privacy\":\"Privacy\",\"support\":\"Support\"},\"notFound\":{\"title\":\"Page Not Found\",\"description\":\"The page you're looking for doesn't exist or has been moved.\",\"goHome\":\"Go Home\",\"goBack\":\"Go Back\"},\"common\":{\"loading\":\"Loading...\",\"error\":\"Error\"},\"languageSwitcher\":{\"label\":\"Change language\",\"currentLanguage\":\"Current language: {language}\"},\"privacy\":{\"title\":\"Privacy\",\"statement\":\"I collect as little as I can, and the Crudo app collects nothing at all.\",\"updated\":\"Last updated 18 September 2026\",\"who\":{\"heading\":\"Who is responsible\",\"body\":\"This site and the Crudo app are made by Pedro Feiteira, an independent software engineer based in Portugal. For anything on this page, write to pedrofeiteira.dev@gmail.com.\"},\"site\":{\"heading\":\"This website\",\"body\":\"The only data this site receives is what you type into the contact form: your name, your email address and your message. It is delivered to my inbox through EmailJS, and I use it for one thing only — replying to you. I do not sell it, share it or add it to a mailing list.\\n\\nThis site runs no analytics, sets no tracking cookies and embeds no advertising networks.\"},\"apps\":{\"heading\":\"The Crudo app\",\"body\":\"Crudo collects no personal data whatsoever. It works entirely offline and has no account system.\\n\\nEverything you create in the app — your conversion history, favourites and any yield calibrations — is stored only on your own device, and is removed when you delete the app. None of it is sent to me or to anyone else.\\n\\nPurchases are handled entirely by Apple. I never see your payment details, and Apple tells me only anonymous sales totals.\"},\"legal\":{\"heading\":\"Legal basis and retention\",\"body\":\"Contact-form messages are processed on the basis of your consent, given when you choose to send the form, and kept only as long as the conversation needs them.\\n\\nBecause the app stores nothing off your device, there is no app data for me to retain, disclose or delete.\"},\"rights\":{\"heading\":\"Your rights\",\"body\":\"Under the GDPR you may ask me for a copy of anything I hold about you, ask me to correct or erase it, or object to my using it. Write to pedrofeiteira.dev@gmail.com and I will respond.\\n\\nIf you believe I have handled your data badly, you may complain to the Comissão Nacional de Proteção de Dados (CNPD), Portugal's supervisory authority.\"},\"changes\":{\"heading\":\"Changes\",\"body\":\"If this policy changes, the revised version will appear on this page with a new date at the top.\"}},\"support\":{\"title\":\"Support\",\"statement\":\"Something not working, or a question about Crudo? Write to me directly.\",\"updated\":\"Last updated 18 September 2026\",\"contact\":{\"heading\":\"Getting in touch\",\"body\":\"Email pedrofeiteira.dev@gmail.com, or use the contact form on this site. I read everything and usually reply within two working days.\\n\\nIf you are reporting a problem, telling me your device, your iOS version and what you were doing at the time will get you a useful answer much faster.\"},\"crudo\":{\"heading\":\"About Crudo\",\"body\":\"Crudo converts food weight between its raw and cooked states, by food and cooking method, so the number you log matches the number on your scale. The yield figures come from published USDA data.\\n\\nIt works with no network connection and needs no account.\"},\"purchases\":{\"heading\":\"Purchases and restoring\",\"body\":\"The full food database is a single one-time purchase — there is no subscription. If you have bought it before, on this device or another one, tap Restore Purchase on the paywall or in Settings and it will come back at no extra cost.\\n\\nRefunds are handled by Apple rather than by me, at reportaproblem.apple.com.\"},\"data\":{\"heading\":\"Your data\",\"body\":\"Crudo keeps your history, favourites and calibrations on your device only. To erase all of it, delete the app.\\n\\nThere is no account to close and nothing stored on a server. See the privacy page for the full detail.\"}}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":\"$L19\"}]\n"])</script><script>self.__next_f.push([1,"1a:I[80367,[\"/_next/static/chunks/0t630iav1ssy0.js\",\"/_next/static/chunks/0l-.qr9x90dvj.js\",\"/_next/static/chunks/0v0imyoztdmha.js\",\"/_next/static/chunks/06x-~xn10suvh.js\"],\"ThemeProvider\"]\n1b:I[45948,[\"/_next/static/chunks/0t630iav1ssy0.js\",\"/_next/static/chunks/0l-.qr9x90dvj.js\",\"/_next/static/chunks/0v0imyoztdmha.js\",\"/_next/static/chunks/06x-~xn10suvh.js\"],\"default\"]\n1c:I[22016,[\"/_next/static/chunks/0t630iav1ssy0.js\",\"/_next/static/chunks/0l-.qr9x90dvj.js\",\"/_next/static/chunks/0v0imyoztdmha.js\",\"/_next/static/chunks/06x-~xn10suvh.js\",\"/_next/static/chunks/04.2oj84qrwn7.js\"],\"\"]\n1d:I[58541,[\"/_next/static/chunks/0t630iav1ssy0.js\",\"/_next/static/chunks/0l-.qr9x90dvj.js\",\"/_next/static/chunks/0v0imyoztdmha.js\",\"/_next/static/chunks/06x-~xn10suvh.js\",\"/_next/static/chunks/04.2oj84qrwn7.js\"],\"default\"]\n1e:I[89643,[\"/_next/static/chunks/0t630iav1ssy0.js\",\"/_next/static/chunks/0l-.qr9x90dvj.js\",\"/_next/static/chunks/0v0imyoztdmha.js\",\"/_next/static/chunks/06x-~xn10suvh.js\",\"/_next/static/chunks/04.2oj84qrwn7.js\"],\"default\"]\n1f:I[46696,[\"/_next/static/chunks/0t630iav1ssy0.js\",\"/_next/static/chunks/0l-.qr9x90dvj.js\",\"/_next/static/chunks/0v0imyoztdmha.js\",\"/_next/static/chunks/06x-~xn10suvh.js\"],\"Toaster\"]\n"])</script><script>self.__next_f.push([1,"19:[\"$\",\"$L1a\",null,{\"attribute\":\"class\",\"defaultTheme\":\"system\",\"enableSystem\":true,\"disableTransitionOnChange\":true,\"children\":[[\"$\",\"$L1b\",null,{}],[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$unde
